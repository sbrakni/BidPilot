name: CI

# Quality gates from SPEC §16. Two of these must never be allowed to go soft: the
# cross-tenant suite guards tenant isolation, and the adapter regression tests guard
# against a source silently changing shape.

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Owner connection: migrations and seeding.
  DATABASE_URL: postgresql://bidpilot:bidpilot@localhost:5432/bidpilot?schema=public
  # Application connection: the non-owner role RLS actually applies to (SPEC §17.6).
  DATABASE_APP_URL: postgresql://bidpilot_app:bidpilot_app@localhost:5432/bidpilot?schema=public
  # The web app's Auth.js connection, confined to the authentication tables (ADR-0015). The
  # RLS suite asserts that confinement, so CI has to be able to connect as it.
  DATABASE_AUTH_URL: postgresql://bidpilot_auth:bidpilot_auth@localhost:5432/bidpilot?schema=public

jobs:
  python:
    name: Python - adapters, dedupe, matching, pipeline
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          # An admin role, not the application's. initdb makes POSTGRES_USER the cluster's
          # bootstrap superuser, which is exempt from row-level security and cannot be demoted
          # (Postgres refuses: "the bootstrap user must have the SUPERUSER attribute"). Running
          # the suite as that role would make every tenant boundary inert and the isolation
          # tests vacuous, so the unprivileged owner behind DATABASE_URL is created separately
          # by bootstrap_roles.sql (ADR-0014).
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bidpilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d bidpilot"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The spec targets 3.12; the code supports >= 3.11 (ADR-0003). CI runs the
          # spec's version so that target stays verified.
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "services/ingestion[dev]"
      - name: Lint
        run: ruff check services/ingestion scripts
      - name: Format check
        run: ruff format --check services/ingestion scripts

      # The pipeline suite needs the real schema: it asserts on FOR UPDATE SKIP LOCKED, jsonb
      # and enum casts, and the RLS-aware platform paths. Without a database it would skip
      # itself, which is worse than failing.
      # No `version:` here on purpose - it is read from package.json's `packageManager`, which
      # keeps one authority for the pnpm version. Specifying both makes the action abort.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Prepare database
        # ON_ERROR_STOP on every psql call: without it psql exits 0 after printing ERROR, so a
        # broken bootstrap reports success here and surfaces later as a confusing test failure.
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d bidpilot -c \
            "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS unaccent;"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d bidpilot \
            -v owner_password=bidpilot -v app_password=bidpilot_app -v auth_password=bidpilot_auth \
            -f packages/db/sql/bootstrap_roles.sql
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm db:migrate

      - name: Test
        run: pytest services/ingestion -q

  typescript:
    name: TypeScript - build, typecheck, cross-tenant RLS suite
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector image so the vector columns and HNSW indexes exist (ADR-0004).
        image: pgvector/pgvector:pg16
        env:
          # An admin role, not the application's. initdb makes POSTGRES_USER the cluster's
          # bootstrap superuser, which is exempt from row-level security and cannot be demoted
          # (Postgres refuses: "the bootstrap user must have the SUPERUSER attribute"). Running
          # the suite as that role would make every tenant boundary inert and the isolation
          # tests vacuous, so the unprivileged owner behind DATABASE_URL is created separately
          # by bootstrap_roles.sql (ADR-0014).
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bidpilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d bidpilot"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose - it is read from package.json's `packageManager`, which
      # keeps one authority for the pnpm version. Specifying both makes the action abort.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Bootstrap database extensions and application roles
        # Role creation is a privileged step, deliberately outside the migrations (ADR-0005).
        # ON_ERROR_STOP on every psql call: without it psql exits 0 after printing ERROR, so a
        # broken bootstrap reports success here and surfaces later as a confusing test failure.
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d bidpilot -c \
            "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS unaccent;"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d bidpilot \
            -v owner_password=bidpilot -v app_password=bidpilot_app -v auth_password=bidpilot_auth \
            -f packages/db/sql/bootstrap_roles.sql

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Seed demo environment
        # Also asserts the seed stays runnable, which Phase 0's exit criteria depend on.
        run: pnpm db:seed

      - name: Test (includes the cross-tenant RLS suite, SPEC §15.5)
        run: pnpm test

  ai-eval:
    name: AI eval harness (Annex E.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "services/ingestion[dev]"

      # The harness itself is tested here unconditionally. Annex E.2 rule 5 makes a prompt change
      # something CI must re-evaluate, and measuring equipment that is not itself checked reports
      # whatever it reports - so the scoring rules are asserted even on days the corpus is absent.
      - name: Harness self-tests
        run: pytest services/ingestion/tests/test_evals.py services/ingestion/tests/test_ai_gateway.py -q

      # Every prompt must load and satisfy its Annex E.2 obligations, so a malformed prompt fails
      # here rather than at the first extraction.
      - name: Prompt registry
        run: python scripts/check_prompts.py

      # The gates themselves. Exit 2 means "nothing was measured" - no corpus, or no key - which
      # is reported as a warning rather than a pass, because those are different facts and
      # collapsing them is how a pipeline goes green after the corpus quietly disappears.
      # This step MUST become blocking once fixtures/dce holds the Annex E.3 corpus; see
      # docs/STATUS.md, where the gap is recorded rather than hidden.
      - name: Extraction gates
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          python scripts/run_eval.py
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            echo "::error::Extraction is below an Annex E.4 gate. Per E.2 rule 5, this blocks merge."
            exit 1
          fi
          if [ "$code" -eq 2 ]; then
            echo "::warning::Eval did not run: no gold corpus (Annex E.3) or no provider key."
            echo "::warning::This is NOT a pass. No extraction prompt may ship until it runs."
          fi
