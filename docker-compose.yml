# Local development infrastructure (SPEC §17.1 / Phase 0).
# Application processes run on the host via `pnpm dev`; this file provides state only.
name: bidpilot

services:
  postgres:
    # pgvector >= 0.7 provides halfvec; see docs/DECISIONS.md ADR-0004 for why the
    # schema targets vector(1024) and how to move to halfvec.
    image: pgvector/pgvector:pg16
    environment:
      # The role initdb creates is the cluster's bootstrap superuser, and a superuser is exempt
      # from row-level security - so it must not be the role the application uses. It stays an
      # admin role here; `bidpilot`, which owns the schema and backs DATABASE_URL, is created
      # unprivileged by the bootstrap script below (ADR-0014).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bidpilot
      # Deadline maths is timezone-sensitive; keep the server in UTC (SPEC §16 i18n/TZ).
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Run once, on the first start of a fresh volume, in this order: extensions first, because
      # `vector` is not a trusted extension and only a superuser can create it, then the roles -
      # including the unprivileged `bidpilot` owner the application actually connects as.
      - ./packages/db/sql/dev-init/10_extensions.sql:/docker-entrypoint-initdb.d/10_extensions.sql:ro
      - ./packages/db/sql/bootstrap_roles.sql:/docker-entrypoint-initdb.d/20_bootstrap_roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bidpilot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: bidpilot
      MINIO_ROOT_PASSWORD: bidpilot-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the dev bucket so a fresh `docker compose up` needs no manual step.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 bidpilot bidpilot-dev-secret &&
        mc mb --ignore-existing local/bidpilot-dev &&
        echo "bucket ready"
    restart: "no"

  # Catches transactional mail and the inbound-email connector's test traffic (SPEC §6.5).
  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  miniodata:
