[project]
name = "bidpilot-ingestion"
version = "0.1.0"
description = "BidPilot sourcing & aggregation engine (SPEC F1)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9",
  "httpx>=0.27",
  "python-dateutil>=2.9",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
  # DCE text extraction, page by page, so every citation can name a page (SPEC §9.1).
  "pypdf>=5.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "jsonschema>=4",
  "respx>=0.21",
  "ruff>=0.7",
  "aiosmtpd>=1.4",
  # Builds the DCE test document from real corpus prose (scripts/build_dce_fixture.py).
  "reportlab>=4.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bidpilot_ingestion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

